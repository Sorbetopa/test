<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>また</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            font-size: 2rem;
            color: #8b0000;
            text-shadow: 0 0 10px rgba(139, 0, 0, 0.8);
            animation: flicker 3s infinite; 
        }

        .room-container {
            text-align: center;
        }

        .secret-door {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            color: #222;
            border: 1px solid #111;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.5s ease;
        }


        .secret-door:hover {
            color: #ff0000;
            border-color: #ff0000;
            box-shadow: 0 0 15px #ff0000;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="room-container">
        <h1>スタート</h1>
        <p>ㅤ</p>
        
        <a href="room2.html" class="secret-door">ㅤ</a>
    </div>

    <script>
        document.addEventListener('keydown', function(event) {
            console.log("去る去る去る去る去る去る去る去る去る去る去る去る去る去る去る");
        });
    </script>

</body>
</html>
